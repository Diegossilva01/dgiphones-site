<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CellTech Panamby | Sistema Interno</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./funcionario.css?v=20260929-leads2">
</head>
<body>
<section id="loginScreen" class="login-screen">
  <button id="loginThemeToggle" class="theme-toggle login-theme-toggle" type="button" aria-label="Alternar tema" title="Alternar tema"><i class="fa-solid fa-moon"></i></button>
  <form id="loginForm" class="login-card">
    <div class="brand">CellTech <span>Panamby</span></div>
    <h1>Área de acesso</h1>
    <p>Entre com seu usuário para acessar o sistema.</p>
    <label>Usuário<input id="loginUsuario" autocomplete="username" required></label>
    <label>Senha<input id="loginSenha" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    <small id="loginMsg" class="message"></small>
  </form>
</section>

<script src="/login.js?v=20261008-security"></script>
</body>
</html>
